<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_name }} — Telligence wallboard</title>
<!-- no favicon request (fully self-contained, opens on anything) -->
<link rel="icon" href="data:,">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0b0f14; color:#eef3f8;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  body{ display:flex; flex-direction:column; min-height:100vh; }
  header{ display:flex; align-items:center; gap:18px; padding:14px 24px;
    background:#141b24; border-bottom:1px solid #26313d; flex-wrap:wrap; }
  header .logo{ height:26px; width:auto; }
  header .site{ font-size:22px; font-weight:800; letter-spacing:.2px; }
  header .area{ font-size:18px; color:#8fa0b3; }
  header .spacer{ flex:1; }
  header .clock{ font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  header .dot{ width:12px; height:12px; border-radius:50%; background:#30a46c;
    box-shadow:0 0 10px #30a46c; }
  header .dot.stale{ background:#f5a524; box-shadow:0 0 10px #f5a524; }
  header .dot.off{ background:#e5484d; box-shadow:0 0 10px #e5484d; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; padding:10px 24px 0; }
  .chip{ padding:6px 12px; border-radius:999px; background:#1b242f;
    color:#eef3f8; text-decoration:none; font-size:14px; border:1px solid #26313d; }
  .chip.active{ background:#3b82f6; border-color:#3b82f6; font-weight:700; }
  main{ flex:1; padding:18px 24px; }
  .empty{ display:flex; height:100%; min-height:50vh; align-items:center;
    justify-content:center; flex-direction:column; gap:10px; color:#30a46c; }
  .empty .big{ font-size:44px; font-weight:800; }
  .empty .sub{ color:#8fa0b3; font-size:18px; }
  /* full-width call banners, coloured by call level (matches the Telligence page) */
  .calls{ display:flex; flex-direction:column; gap:12px; }
  .call{ display:flex; align-items:center; gap:22px; padding:18px 26px;
    border-radius:14px; color:#fff; overflow:hidden; }
  .call .loc{ font-size:38px; font-weight:800; line-height:1.05; flex:0 0 auto; }
  .call .mid{ flex:1; min-width:0; }
  .call .type{ font-size:24px; font-weight:700; }
  .call .sub{ font-size:14px; opacity:.85; font-family:monospace; margin-top:2px; }
  .call .right{ display:flex; align-items:center; gap:22px; margin-left:auto; white-space:nowrap; }
  .call .prio{ font-size:16px; font-weight:800; background:rgba(255,255,255,.24);
    padding:4px 14px; border-radius:20px; }
  .call .dur{ font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .lvl-emergency{ background:#DA291C; }
  .lvl-wc{ background:#e8590c; }
  .lvl-call{ background:#f08c00; }
  .lvl-presence{ background:#2f9e44; }
  .lvl-staff{ background:#1c7ed6; }
  .lvl-other{ background:#868e96; }
  .call.lvl-emergency{ animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(218,41,28,0);} 50%{ box-shadow:0 0 0 7px rgba(218,41,28,.5);} }
  .section-h{ font-size:15px; text-transform:uppercase; letter-spacing:.08em;
    color:#8fa0b3; margin:24px 0 10px; }
  .faults{ display:flex; flex-direction:column; gap:10px; }
  .fault{ display:flex; align-items:center; gap:18px; padding:14px 22px; border-radius:12px;
    background:rgba(218,41,28,.14); border:1px solid rgba(218,41,28,.5); }
  .fault .rm{ font-size:24px; font-weight:800; }
  .fault .ft{ color:#ff7676; font-weight:700; }
  .fault .du{ color:#8fa0b3; font-size:14px; margin-left:auto; }
  footer{ padding:8px 24px 12px; color:#8fa0b3; font-size:12px; text-align:right; }
</style>
</head>
<body>

  <span class="site">{{ site_name }}</span>
  <span class="area" id="area-name"></span>
  <span class="spacer"></span>
  <span class="dot" id="conn-dot" title="live"></span>
  <span class="clock" id="clock">--:--</span>
</header>
<div class="chips" id="chips"></div>
<main id="board"></main>
<footer><span id="foot"></span></footer>

<script>
/* Plain ES5 + XMLHttpRequest, no external requests — opens on any browser. */
(function(){
  "use strict";
  var TOKEN = {{ token|tojson }};
  var AREA  = {{ area|tojson }};
  var REFRESH = Math.max(3, parseInt("{{ refresh }}", 10) || 10);
  var SITE = {{ site_name|tojson }};
  var lastOk = 0;

  function esc(s){ var d = document.createElement("div"); d.appendChild(document.createTextNode(s == null ? "" : String(s))); return d.innerHTML; }
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function dur(sec){
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ":" : "") + two(m) + ":" + two(s);
  }
  function lvlClass(c){
    c = (c || "other").toLowerCase();
    if (c !== "emergency" && c !== "wc" && c !== "call" && c !== "presence" && c !== "staff") c = "other";
    return "lvl-" + c;
  }
  function byId(id){ return document.getElementById(id); }

  function render(d){
    byId("area-name").innerHTML = AREA ? "· " + esc(d.area_name || AREA) : "· All duty areas";
    var chips = byId("chips"); var ch = "";
    if (!AREA && d.duty_areas && d.duty_areas.length > 1){
      for (var i = 0; i < d.duty_areas.length; i++){
        var z = d.duty_areas[i];
        ch += '<a class="chip" href="?area=' + encodeURIComponent(z.string) + '">' + esc(z.name) + '</a>';
      }
    }
    chips.innerHTML = ch;

    var active = d.active || [], faults = d.faults || [];
    var board = byId("board");
    if (!active.length && !faults.length){
      board.innerHTML = '<div class="empty"><div class="big">All clear</div>' +
        '<div class="sub">No active calls' + (AREA ? " in this duty area" : "") + '</div></div>';
      return;
    }
    var html = "";
    if (active.length){
      html += '<div class="calls">';
      for (var a = 0; a < active.length; a++){
        var c = active[a];
        var loc = c.name || c.location_text || c.location_string || "Unknown";
        var cat = (c.category || "other").toLowerCase();
        var prio = c.priority || "";
        var sub = (!AREA && c.duty) ? c.duty.name : "";
        html += '<div class="call ' + lvlClass(cat) + '">' +
          '<div class="loc">' + esc(loc) + '</div>' +
          '<div class="mid"><div class="type">' + esc(c.event_text || "Call") + '</div>' +
            (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' +
          '<div class="right">' +
            (prio ? '<span class="prio">' + esc(prio) + '</span>' : '') +
            '<span class="dur" data-ts="' + (c.raised_ts || 0) + '">--:--</span>' +
          '</div></div>';
      }
      html += '</div>';
    }
    if (faults.length){
      html += '<div class="section-h">Device faults (' + faults.length + ')</div><div class="faults">';
      for (var f = 0; f < faults.length; f++){
        var x = faults[f];
        html += '<div class="fault"><div class="rm">' + esc(x.name || x.location_text || x.ident) + '</div>' +
          '<div class="ft">' + esc(x.detail || "Fault") + '</div>' +
          (!AREA && x.duty ? '<div class="du">' + esc(x.duty.name) + '</div>' : '') +
          '</div>';
      }
      html += '</div>';
    }
    board.innerHTML = html;
    tickDurations();
  }

  function tickDurations(){
    var now = (new Date()).getTime() / 1000;
    var els = document.getElementsByClassName("dur");
    for (var i = 0; i < els.length; i++){
      var ts = parseFloat(els[i].getAttribute("data-ts")) || 0;
      els[i].innerHTML = ts ? dur(now - ts) : "--:--";
    }
  }

  function setConn(state){
    byId("conn-dot").className = "dot" + (state === "off" ? " off" : state === "stale" ? " stale" : "");
  }

  function load(){
    var xhr = new XMLHttpRequest();
    var url = "/api/w/tel/" + encodeURIComponent(TOKEN) +
      (AREA ? "?area=" + encodeURIComponent(AREA) + "&" : "?") + "_=" + (new Date()).getTime();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function(){
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200){
        var d;
        try { d = JSON.parse(xhr.responseText); } catch (e){ return; }
        lastOk = (new Date()).getTime(); setConn("ok"); render(d);
        byId("foot").innerHTML = esc(SITE) + " · updated " + esc((new Date()).toLocaleTimeString());
      } else {
        setConn((new Date()).getTime() - lastOk > REFRESH * 3000 ? "off" : "stale");
      }
    };
    try { xhr.send(); } catch (e){ setConn("off"); }
  }

  function clock(){
    var n = new Date();
    byId("clock").innerHTML = two(n.getHours()) + ":" + two(n.getMinutes()) + ":" + two(n.getSeconds());
  }

  clock(); load();
  setInterval(clock, 1000);
  setInterval(tickDurations, 1000);
  setInterval(load, REFRESH * 1000);
})();
</script>
</body>
</html>
